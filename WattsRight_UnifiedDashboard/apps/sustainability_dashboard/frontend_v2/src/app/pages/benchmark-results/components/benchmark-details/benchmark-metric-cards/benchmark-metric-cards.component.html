<div *ngIf="metrics as m" class="metrics-cards">
  <app-benchmark-metric-card
    *ngIf="m.power as pow"
    [metric]="pow"
    [type]="'power'"
    [scientificNotation]="true">
  </app-benchmark-metric-card>

  <app-benchmark-metric-card
    *ngIf="m.performance as perf"
    [metric]="perf"
    [type]="'performance'">
  </app-benchmark-metric-card>

  <app-benchmark-metric-card
    *ngIf="m.emissions as emi"
    [metric]="emi"
    [type]="'emissions'"
    [scientificNotation]="true">
  </app-benchmark-metric-card>

  <app-benchmark-metric-card
    *ngIf="m.compute as comp"
    [metric]="comp"
    [type]="'compute'">
  </app-benchmark-metric-card>
</div>
