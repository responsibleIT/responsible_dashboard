<div class="benchmark-results" *ngIf="metricCards; else loadingState">
  <aside class="sidebar">
    <app-benchmark-menu-left
      *ngIf="benchmarkData"
      [data]="benchmarkData"
      (export)="exportModel()"
      (goBack)="goBack()">
    </app-benchmark-menu-left>
  </aside>

  <section class="main">
    <app-benchmark-details
      [metricCards]="metricCards"
      [classes]="classes">
    </app-benchmark-details>
  </section>
</div>

<ng-template #loadingState>
  <div class="loading">Loading benchmark results...</div>
</ng-template>
